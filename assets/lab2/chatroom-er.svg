<svg style="background-color:#ffffff;color-scheme:light" xmlns="http://www.w3.org/2000/svg" width="2400" height="2100" viewBox="0 0 1200 1050"><rect width="2400" height="2100" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:22px;fill:black}.name{font-size:27px}.small{font-size:20px}line,path,rect{stroke:black;stroke-width:3;fill:none}</style><rect x="60" y="150" width="250" height="118"/><text x="75" y="183" class="name">User</text><line x1="60" y1="200" x2="310" y2="200"/><text x="72" y="227" class="">userID {PK}</text><text x="72" y="255" class="">displayName</text><rect x="860" y="150" width="270" height="118"/><text x="875" y="183" class="name">Space</text><line x1="860" y1="200" x2="1130" y2="200"/><text x="872" y="227" class="">spaceID {PK}</text><text x="872" y="255" class="">spaceName</text><rect x="60" y="600" width="270" height="146"/><text x="75" y="633" class="name">Message</text><line x1="60" y1="650" x2="330" y2="650"/><text x="72" y="677" class="">messageID {PK}</text><text x="72" y="705" class="">dateTime</text><text x="72" y="733" class="">bodyText</text><rect x="830" y="600" width="330" height="202"/><text x="845" y="633" class="name">Channel</text><line x1="830" y1="650" x2="1160" y2="650"/><text x="842" y="677" class="">channelID {PK}</text><text x="842" y="705" class="">name</text><text x="842" y="733" class="">position</text><text x="842" y="761" class="">allowedViewRoles {multiple}</text><text x="842" y="789" class="">allowedPostRoles {multiple}</text><path d="M310 190 H860"/><text x="325" y="215" class="">1..*</text><text x="825" y="215" class="">*</text><text x="485" y="175" class="">Belongs to ▶</text><path d="M580 190 V240" style="stroke-dasharray:6 5"/><rect x="470" y="240" width="225" height="90"/><text x="485" y="273" class="name">Membership</text><line x1="470" y1="290" x2="695" y2="290"/><text x="482" y="317" class="">isModerator</text><path d="M185 150 V65 H995 V150"/><text x="205" y="130" class="">1</text><text x="1010" y="130" class="">*</text><text x="460" y="52" class="">Administers ▶</text><path d="M185 268 V600"/><text x="200" y="300" class="">1</text><text x="200" y="580" class="">*</text><text x="200" y="475" class="">Writes ▼</text><path d="M995 268 V600"/><text x="1010" y="300" class="">1</text><text x="1010" y="580" class="">*</text><text x="1010" y="475" class="">Contains ▼</text><path d="M330 690 H830"/><text x="345" y="717" class="">*</text><text x="800" y="717" class="">1</text><text x="480" y="675" class="">Belongs to ▶</text><path d="M310 240 H390 V445 H830 V640"/><text x="325" y="265" class="">*</text><text x="800" y="630" class="">*</text><text x="475" y="430" class="">Has settings for ▶</text><path d="M595 445 V480" style="stroke-dasharray:6 5"/><rect x="475" y="480" width="240" height="118"/><text x="490" y="513" class="name">Settings</text><line x1="475" y1="530" x2="715" y2="530"/><text x="487" y="557" class="">isJoined</text><text x="487" y="585" class="">isMuted</text><text x="60" y="905" class="small">Notation: 1 = exactly one; * = zero or more; 1..* = one or more.</text><text x="60" y="935" class="small">▶ and ▼ show how to read relationship names; they do not show foreign-key direction.</text><text x="60" y="965" class="small">Dashed links attach attributes to relationships. They are not extra entity relationships.</text><text x="60" y="995" class="small">{multiple} marks a conceptual set of roles; translate it into separate tables later.</text></svg>